<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d63e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>格物 · 数理7天速成</title>
<style>
:root{
  --bg:#f2f5fb; --card:#ffffff; --txt:#1c2440; --sub:#6b7495; --pri:#3d63e6; --pri2:#22b8d8;
  --ok:#16a34a; --bad:#e11d48; --warn:#d97706; --line:#e3e8f4; --chip:#edf1fa; --chipOn:#3d63e6;
  --shadow:0 2px 12px rgba(35,45,90,.07); --radius:16px;
}
body.dark{
  --bg:#0e1220; --card:#181d2e; --txt:#e8ebf5; --sub:#98a0ba; --pri:#7c9bff; --pri2:#4fd6ea;
  --ok:#4ade80; --bad:#fb7185; --warn:#fbbf24; --line:#272c40; --chip:#222739; --chipOn:#7c9bff;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);font-size:15px;line-height:1.65;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));transition:background .25s;
}
b{color:var(--pri)}
header{position:sticky;top:0;z-index:50;background:var(--bg);padding:10px 14px 6px;transition:background .25s}
.hrow{display:flex;align-items:center;gap:10px}
.hlogo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),var(--pri2));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow)}
.htitle{font-size:17px;font-weight:800;letter-spacing:.5px}
.hsub{font-size:11.5px;color:var(--sub)}
.iconbtn{margin-left:auto;width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--txt);font-size:18px;box-shadow:var(--shadow);cursor:pointer}
main{max-width:760px;margin:0 auto;padding:8px 14px 30px}
.tab{display:none;animation:fade .22s ease}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px;margin-bottom:12px}
.secTitle{font-size:13px;font-weight:800;color:var(--sub);margin:18px 2px 8px;letter-spacing:1px}
.muted{color:var(--sub);font-size:12.5px}
/* ---- home hero ---- */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#1c2b5e 0%,#101a36 55%,#0a2c40 100%);color:#fff;border-radius:20px;padding:0}
.heroSym{position:absolute;inset:0;overflow:hidden}
.heroSym span{position:absolute;color:rgba(255,255,255,.07);font-weight:900;font-family:Georgia,serif}
.heroSym span:nth-child(1){top:8px;right:18px;font-size:64px}
.heroSym span:nth-child(2){top:74px;right:88px;font-size:34px}
.heroSym span:nth-child(3){top:22px;right:120px;font-size:22px;font-style:italic}
.heroSym span:nth-child(4){bottom:64px;right:26px;font-size:44px}
.heroSym span:nth-child(5){bottom:8px;right:130px;font-size:52px}
.heroSym span:nth-child(6){top:96px;right:8px;font-size:30px}
.heroSym span:nth-child(7){bottom:96px;right:104px;font-size:26px}
.heroSym span:nth-child(8){top:44px;right:196px;font-size:30px}
.heroInner{position:relative;z-index:2;padding:34px 16px 16px}
.hero .heroTitle{font-size:26px;font-weight:900;letter-spacing:6px}
.hero .heroSub{font-size:12.5px;opacity:.9;margin-top:5px;letter-spacing:.5px}
.hero b{color:#fff}
.statsRow{display:flex;gap:8px;margin-top:13px}
.stat{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 4px;text-align:center}
.stat .n{font-size:17px;font-weight:900}
.stat .l{font-size:10.5px;opacity:.9}
.progWrap{margin-top:13px}
.progBar{height:9px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.progBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,#bfe9ff);border-radius:9px;transition:width .4s}
.progTxt{font-size:11.5px;opacity:.95;margin-top:5px}
/* ---- day grid ---- */
.dayGrid{display:grid;grid-template-columns:1fr;gap:10px}
.dayCard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 15px;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.dayCard:active{transform:scale(.985)}
.dcTop{display:flex;align-items:center;gap:8px}
.dcDay{font-weight:900;font-size:15px;color:var(--pri)}
.dcTag{font-size:10.5px;background:var(--chip);color:var(--sub);border-radius:20px;padding:1px 8px}
.dcTitle{font-size:13px;color:var(--sub);margin-top:2px;flex:1}
.dcSub{font-size:11.5px;color:var(--sub);margin-top:3px;opacity:.85}
.dcBar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:9px}
.dcBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px;transition:width .4s}
.dcBtns{display:flex;gap:8px;margin-top:10px}
.dcBtns button{flex:1;border:none;border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--chip);color:var(--txt)}
.dcBtns button.p{background:var(--pri);color:#fff}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;margin-top:10px}
.btn.danger{background:var(--bad)}
/* ---- chips & filters ---- */
.filters{position:sticky;top:58px;z-index:40;background:var(--bg);padding:6px 0 8px}
.frow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;font-weight:600;transition:all .15s}
.chip.on{background:var(--chipOn);border-color:var(--chipOn);color:#fff}
.chip.hf.on{background:var(--warn);border-color:var(--warn)}
.chip.s0.on{background:#3d63e6;border-color:#3d63e6}
.chip.s1.on{background:#7c3aed;border-color:#7c3aed}
.chip.s2.on{background:#d97706;border-color:#d97706}
.chip.s3.on{background:#059669;border-color:#059669}
#searchBox{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 13px;font-size:13.5px;color:var(--txt);outline:none;font-family:inherit}
#searchBox:focus{border-color:var(--pri)}
.wprog{font-size:12px;color:var(--sub);margin:2px 2px 10px}
.wprog b{color:var(--ok)}
.wprog .r{color:var(--bad)}
/* ---- formula card ---- */
#cardArea{position:relative}
.fcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 18px 16px;min-height:330px;display:flex;flex-direction:column;animation:cardin .25s ease}
@keyframes cardin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.fmeta{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.bd{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--chip);color:var(--sub)}
.bd.s0{background:#e4ecff;color:#2743a8}
.bd.s1{background:#f0e8ff;color:#6d28d9}
.bd.s2{background:#fdf0dc;color:#b45309}
.bd.s3{background:#def7ea;color:#047857}
body.dark .bd.s0{background:#16224a;color:#9db4ff}
body.dark .bd.s1{background:#2a1a4a;color:#c4b5fd}
body.dark .bd.s2{background:#3a2a08;color:#fcd34d}
body.dark .bd.s3{background:#0c3025;color:#6ee7b7}
.bd.hot{background:#fef3c7;color:#b45309}
body.dark .bd.hot{background:#3d2c08;color:#fcd34d}
.bd.rev{background:#dcfce7;color:#15803d}
body.dark .bd.rev{background:#0d2f1a;color:#86efac}
.fidx{font-size:11px;color:var(--sub);margin-left:auto}
.fname{font-size:23px;font-weight:900;letter-spacing:.5px;margin:16px 0 4px;text-align:center;word-break:break-word;cursor:pointer}
.fans{margin:14px auto 0;font-size:17px;font-weight:700;max-width:620px;cursor:pointer;min-height:64px;display:flex;align-items:center;justify-content:center;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line);transition:filter .2s,opacity .2s;flex-wrap:wrap;text-align:center;line-height:1.8;word-break:break-word}
.fans.blur{filter:blur(7px);opacity:.55;user-select:none}
.fans.hide{color:var(--sub);font-weight:600;letter-spacing:2px}
.fans .hint{font-size:12px;color:var(--sub);font-weight:500;letter-spacing:0}
.fans .fx{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.fnote{margin:12px auto 0;max-width:620px;background:var(--chip);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--sub);display:none}
.fnote.show{display:block}
.fnote b{color:var(--warn)}
.facts{display:flex;gap:9px;margin-top:auto;padding-top:16px}
.facts button{flex:1;border:none;border-radius:14px;padding:13px 0;font-size:14.5px;font-weight:800;cursor:pointer;transition:transform .1s}
.facts button:active{transform:scale(.97)}
.actBad{background:var(--bad);color:#fff}
.actOk{background:var(--ok);color:#fff}
.actNext{background:var(--pri);color:#fff}
.actSkip{background:var(--chip);color:var(--sub);flex:.7!important}
/* ---- list ---- */
.lrow{display:flex;align-items:flex-start;gap:10px;background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer}
.lmain{flex:1;min-width:0}
.lname{font-weight:800;font-size:15px}
.ltag{font-size:11px;color:var(--sub);margin-left:6px;font-weight:500}
.lans{font-size:13px;margin-top:2px;transition:filter .18s,opacity .18s;word-break:break-word}
.lans.blur{filter:blur(5px);opacity:.5}
.lans.hide{color:var(--sub)}
.lbtns{display:flex;flex-direction:column;gap:5px}
.lbtns button{border:none;width:34px;height:30px;border-radius:9px;font-size:13px;cursor:pointer;background:var(--chip);color:var(--sub)}
.lbtns button.ok.on{background:var(--ok);color:#fff}
.lbtns button.bad.on{background:var(--bad);color:#fff}
.moreBtn{display:block;width:100%;border:1.5px dashed var(--line);background:none;color:var(--sub);border-radius:12px;padding:10px;font-size:13px;cursor:pointer;margin-top:4px}
/* ---- lessons ---- */
.gdayHead{background:linear-gradient(135deg,var(--pri),var(--pri2));border-radius:18px;color:#fff;padding:14px 16px;margin-bottom:12px}
.gdayHead .t{font-size:17px;font-weight:900}
.gdayHead .s{font-size:12px;opacity:.92;margin-top:2px}
.gdayHead b{color:#fff}
.lcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden}
.lh{display:flex;align-items:center;gap:8px;padding:13px 15px;cursor:pointer;user-select:none}
.lh .t{font-size:14.5px;font-weight:800;flex:1}
.lh .arrow{color:var(--sub);font-size:12px;transition:transform .2s}
.lcard.open .lh .arrow{transform:rotate(90deg)}
.ldone{border:1.5px solid var(--line);background:none;border-radius:20px;color:var(--sub);font-size:11px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.ldone.on{background:var(--ok);border-color:var(--ok);color:#fff}
.lbody{display:none;padding:0 15px 4px;font-size:13.5px;line-height:1.8}
.lcard.open .lbody{display:block}
.lex{display:none;margin:8px 0 0;padding:0 15px}
.lcard.open .lex{display:block}
.lex .ex{background:var(--chip);border-left:3px solid var(--pri);border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.8}
.lex .ex .zh{color:var(--sub);font-size:12.5px;margin-top:3px}
.lex .ex .fx{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.ltip{margin:9px 15px 13px;background:#fff8e6;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#8a5a00;line-height:1.75;display:none}
.lcard.open .ltip{display:block}
body.dark .ltip{background:#33290e;color:#fcd34d}
.ltip .ti{font-weight:800}
/* ---- quiz ---- */
.qcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:17px 16px}
.qnum{font-size:12px;color:var(--sub);font-weight:700}
.qq{font-size:16px;font-weight:800;margin:9px 0 14px;line-height:1.7}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:none;color:var(--txt);border-radius:12px;padding:12px 13px;font-size:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;font-family:inherit;line-height:1.6}
.qopt:active{transform:scale(.99)}
.qopt.ok{border-color:var(--ok);background:rgba(22,163,74,.12);font-weight:700}
.qopt.bad{border-color:var(--bad);background:rgba(225,29,72,.1)}
.qopt:disabled{cursor:default}
.qfb{border-radius:12px;padding:11px 13px;font-size:13px;margin-top:4px;display:none;line-height:1.8}
.qfb.show{display:block}
.qfb.ok{background:rgba(22,163,74,.12);color:var(--ok)}
.qfb.bad{background:rgba(225,29,72,.1);color:var(--bad)}
.qfb .why{color:var(--txt);margin-top:4px;font-size:12.5px}
.qfb .why b{color:var(--pri)}
.spellRow{display:flex;gap:8px}
.spellRow input{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:16px;color:var(--txt);outline:none;font-family:inherit}
.spellRow input:focus{border-color:var(--pri)}
.spellRow button{border:none;border-radius:12px;background:var(--pri);color:#fff;font-weight:800;padding:0 18px;cursor:pointer;font-size:14px}
.qscore{text-align:center;padding:20px 10px}
.qscore .big{font-size:42px;font-weight:900;color:var(--pri)}
.qscore .sub{font-size:13px;color:var(--sub);margin-top:2px}
.wrongList{text-align:left;margin-top:14px}
.wrongItem{background:var(--chip);border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px;line-height:1.75}
.wrongItem b{font-weight:800}
.wrongItem .wans{color:var(--bad)}
.wrongItem .rans{color:var(--ok)}
/* ---- nav & misc ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);box-shadow:0 -2px 16px rgba(35,45,90,.1);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:none;background:none;color:var(--sub);font-size:11px;font-weight:700;padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--pri);background:var(--chip)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:80%;text-align:center}
#toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:13.5px}
/* ---- splash ---- */
#splash{position:fixed;inset:0;z-index:999;background:linear-gradient(150deg,#16224a 0%,#0c1428 60%,#0a2c40 100%);opacity:1;transition:opacity .5s}
#splash.gone{opacity:0;pointer-events:none}
#splash .spSym span{position:absolute;color:rgba(255,255,255,.05);font-weight:900;font-family:Georgia,serif}
#splash .spSym span:nth-child(1){top:6%;left:8%;font-size:110px}
#splash .spSym span:nth-child(2){top:20%;right:10%;font-size:70px}
#splash .spSym span:nth-child(3){bottom:26%;left:12%;font-size:80px}
#splash .spSym span:nth-child(4){bottom:10%;right:16%;font-size:60px}
#splash .spSym span:nth-child(5){top:42%;right:26%;font-size:44px}
#splash .spTxt{position:absolute;left:0;right:0;bottom:16%;text-align:center}
#splash .st1{font-size:36px;font-weight:900;color:#fff;letter-spacing:14px;text-indent:14px}
#splash .st3{font-size:12px;color:#9aa0b8;letter-spacing:10px;text-indent:10px;margin-top:8px;font-weight:600}
#splash .st2{font-size:13px;color:#cfd3e6;margin-top:8px;letter-spacing:1px}
@media(min-width:640px){.dayGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
